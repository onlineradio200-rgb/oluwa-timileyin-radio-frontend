<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Upload - Oluwa Timileyin Radio</title>
</head>
<body>
  <h1>Admin Panel - Upload Music</h1>

  <form id="uploadForm">
    <input type="file" name="music" id="musicInput" accept=".mp3,.aac,.wav" required>
    <button type="submit">Upload</button>
  </form>

  <div id="status"></div>

  <script>
    const form = document.getElementById('uploadForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('musicInput');
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append('music', fileInput.files[0]);

      try {
        const res = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.success) {
          status.innerText = `Uploaded successfully: ${data.filename}`;
        } else {
          status.innerText = 'Upload failed';
        }
      } catch (err) {
        status.innerText = 'Error uploading file';
      }
    });
  </script>
</body>
  </html>

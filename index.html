<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oluwa Timileyin Radio</title>
</head>
<body>
  <h1>Oluwa Timileyin Radio</h1>
  <audio id="radioPlayer" controls autoplay></audio>
  <br>
  <button id="musicBtn">Play Music</button>
  <button id="liveBtn">Go Live</button>

  <script>
    const player = document.getElementById("radioPlayer");

    async function playMusic() {
      const res = await fetch("https://oluwa-timileyin-radio-backend-jgwk.onrender.com/music/list");
      const list = await res.json();
      let i = 0;
      if(list.length === 0) return alert("No music uploaded yet!");
      player.src = list[i].url;
      player.play();

      player.onended = () => {
        i = (i + 1) % list.length;
        player.src = list[i].url;
        player.play();
      };
    }

    async function playLive() {
      const res = await fetch("https://oluwa-timileyin-radio-backend-jgwk.onrender.com/live");
      const live = await res.json();
      player.src = live.url;
      player.play();
    }

    document.getElementById("musicBtn").onclick = playMusic;
    document.getElementById("liveBtn").onclick = playLive;

    // Start music automatically
    playMusic();
  </script>
</body>
</html>

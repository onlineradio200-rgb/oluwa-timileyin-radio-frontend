<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oluwa-Timileyin Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="radio-container">
    <h1>📻 Oluwa-Timileyin Radio</h1>

    <p id="status">Mode: Music Radio</p>

    <audio id="radioPlayer" controls autoplay></audio>

    <div class="controls">
      <button onclick="playMusic()">▶️ Play Music</button>
      <button onclick="playLiveMic()">🎙️ Live Mic</button>
      <button onclick="stopRadio()">⏹ Stop</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oluwa-Timileyin Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Style -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="radio-container">

    <h1 class="radio-title">Oluwa-Timileyin Radio</h1>

    <p id="status" class="radio-status">
      Connecting to live broadcast…
    </p>

    <!-- Hidden Audio Player -->
    <audio id="radioPlayer" preload="auto"></audio>

    <div class="radio-controls">
      <button id="playBtn">▶ Play Radio</button>
      <button id="liveBtn">🎙 Live</button>
    </div>

    <div class="radio-footer">
      <span>🔴 Broadcasting 24/7</span>
    </div>

  </div>

  <!-- Script -->
  <script src="script.js"></script>

</body>
  </html>

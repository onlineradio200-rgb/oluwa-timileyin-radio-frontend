<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Oluwa-Timileyin Radio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: center;
      color: gold;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .radio-box {
      padding: 25px;
      border: 1px solid gold;
      border-radius: 15px;
      background: rgba(0,0,0,0.6);
    }
    h1 {
      margin-bottom: 15px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="radio-box">
    <h1>📻 Oluwa-Timileyin Radio</h1>
    <p>Live Gospel | Word | Worship</p>
    <audio id="radioPlayer" controls autoplay></audio>
    <p id="status">Loading stream…</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
